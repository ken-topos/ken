# ken federation — moot launch profile. TWO HARNESSES, split 25 / 3.
#
# ⚠ THIS HEADER WAS REWRITTEN 2026-07-25 BECAUSE IT DESCRIBED A FLEET THAT NO
# LONGER EXISTS. The previous version claimed "EVERY role runs DIRECT on the
# Anthropic subscription", "enclave on claude-opus-*", "all build / coordination
# roles on claude-sonnet-5", and "ONE EXCEPTION — foundation-implementer routes
# through the local claudex proxy". Every one of those is now FALSE: no seat runs
# sonnet-5, the enclave is not on Anthropic at all, and there is no claudex route
# or `env` block anywhere in this file. Derive wiring from the `[agents.*]`
# blocks below, never from prose — including this prose.
#
# **25 seats — native Codex harness** (`harness = "codex"`, the operator's
# ChatGPT/Codex subscription). Two tiers, by role shape rather than by team:
#   - `gpt-5.6-sol`   — implementers, and the seats that author or audit deeply
#                       (spec-author, conformance-validator, architect,
#                       librarian, doc-author, research).
#   - `gpt-5.6-terra` — leaders and QA (coordination + verification).
# Effort is `model_reasoning_effort` on these seats, NOT `effort`.
#
# **3 seats — Claude Code direct on the Anthropic subscription** (OAuth via the
# steward's cold-start `/login`; these use `effort`, not
# `model_reasoning_effort`), all on `claude-opus-5[1m]`:
#   - `steward`             — operator proxy / workflow authority.
#   - `adversary`           — standing red team.
#   - `runtime-implementer` — reseated from `gpt-5.6-sol` on 2026-07-25 per the
#                             operator: early results show Opus 5 is the stronger
#                             coding model. ⚠ This is the one seat where the
#                             MODELS.md tier table is deliberately overridden —
#                             a T2 build seat running a T1 model. Treat the tier
#                             table as a DEFAULT, not a constraint.
#
# ⛔ The two harnesses need DIFFERENT operational handling, and conflating them
# has cost real time. Codex seats: strand on a convo mention (repair with a bare
# `Enter`), take `/compact` reliably via `moot compact`, and need `send-keys -l`
# for literal text. Claude Code seats: do not strand on mentions, and `moot
# compact` is no-op-prone there — prefer `send-keys`. See
# `agent/playbooks/federation/steward.md` §2c for the full mechanics.

[convo]
api_url = "https://mootup.io"
space_id = "spc_4q7g0se87rgje"

[harness]
# Cold-start role: launched first on `moot up`, used for the interactive
# Anthropic OAuth /login (an Opus/subscription enclave role). The operator's
# primary proxy into the federation.
human_interface = "steward"

# Launch-cascade pacing. mootup defaults this to 2.0s/agent to avoid storming
# the convo join_space endpoint on cold start; we disable it (0) because the
# server-side rate limit was relaxed 10x and the box (t3.small) peaked at ~35%
# CPU under the full 25-agent burst — so the stagger only slows launch for no
# benefit. Re-enable (e.g. 1-2s) if a future, larger fleet herds join_space.
launch_stagger_seconds = 30

[agents.spec-author]
display_name = "spec-author"
model = "gpt-5.6-sol"
harness = "codex"
model_reasoning_effort = "high"
startup_prompt = "You are Ken's spec author (clean-room enclave). Read agent/COORDINATION.md (federation law) and MODELS.md first. Read agent/playbooks/spec/spec-author.md and CLEAN-ROOM.md, set your status, and await the spec leader's kickoff. Do not poll."

